<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <!-- dod-manifest-template 1.0.1 -->
  <title><!--DOD_TITLE--></title>
  <style>
    :root {
      --paper: #e7edf1;
      --panel: #f4f7f9;
      --panel-strong: #fbfcfd;
      --ink: #1a2836;
      --ink-muted: #3d4c5b;
      --rule: #8a99a8;
      --rule-strong: #5d6d7c;
      --accent: #0e5c66;
      --accent-wash: #d4e4e6;
      --spine: #0e5c66;
      --focus: #0e5c66;
      --pass-ink: #154b36;
      --pass-fill: #d7ebe2;
      --pass-rule: #1b5e45;
      --gap-ink: #6b2a22;
      --gap-fill: #f3e2dc;
      --gap-rule: #8b3a30;
      --hold-ink: #5a4718;
      --hold-fill: #f0e8d4;
      --hold-rule: #8a6d28;
      --na-ink: #3a4550;
      --na-fill: #e2e6ea;
      --na-rule: #6a7580;
      --plan-ink: #1a2836;
      --plan-fill: #e8eef2;
      --plan-rule: #5d6d7c;
      --font-display: Palatino, "Palatino Linotype", "Book Antiqua", "URW Palladio L", "TeX Gyre Pagella", Georgia, serif;
      --font-body: "Segoe UI", "Liberation Sans", "Nimbus Sans L", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.5rem;
      --space-6: 2rem;
      --space-7: 3rem;
      --measure: 68ch;
      --content: 74rem;
      --radius: 2px;
      --table-min: 46rem;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--font-body);
      font-size: 1rem;
      line-height: 1.55;
      min-height: 100%;
    }

    :focus { outline: none; }
    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .skip {
      position: absolute;
      left: var(--space-4);
      top: -3rem;
      z-index: 20;
      padding: var(--space-2) var(--space-4);
      background: var(--panel-strong);
      color: var(--ink);
      border: 2px solid var(--accent);
      text-decoration: underline;
    }
    .skip:focus, .skip:focus-visible {
      top: var(--space-4);
    }

    a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 0.15em;
    }
    a:hover { text-decoration-thickness: 2px; }

    code {
      font-family: ui-monospace, "Cascadia Mono", "Liberation Mono", Menlo, Consolas, monospace;
      font-size: 0.92em;
      white-space: nowrap;
    }

    .page {
      max-width: var(--content);
      margin: 0 auto;
      padding: var(--space-5) var(--space-5) var(--space-7);
      border-left: 8px solid var(--spine);
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(14, 92, 102, 0.06), rgba(14, 92, 102, 0) 11rem),
        var(--paper);
    }

    header.mast {
      position: relative;
      padding-bottom: var(--space-5);
      margin-bottom: var(--space-5);
      border-bottom: 2px solid var(--ink);
    }

    .mast-wave {
      display: block;
      width: 100%;
      height: 3.25rem;
      margin: 0 0 var(--space-4);
      overflow: visible;
    }

    .kicker {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin: 0 0 var(--space-4);
    }

    .stamp {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: 0.2rem 0.55rem;
      border: 2px solid var(--accent);
      color: var(--accent);
      background: var(--panel);
      font-size: 0.8125rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.3;
    }
    .stamp-warn {
      border-color: var(--gap-rule);
      color: var(--gap-ink);
      background: var(--gap-fill);
    }
    .stamp-state {
      border-style: solid;
      border-width: 2px 2px 2px 8px;
    }

    h1 {
      margin: 0 0 var(--space-3);
      font-family: var(--font-display);
      font-size: clamp(1.75rem, 3vw, 2.5rem);
      font-weight: 700;
      line-height: 1.15;
      color: var(--ink);
      max-width: 28ch;
    }

    .lede {
      margin: 0;
      max-width: var(--measure);
      color: var(--ink-muted);
      font-size: 1.0625rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 15.5rem minmax(0, 1fr);
      gap: var(--space-6);
      align-items: start;
    }

    nav.toc {
      position: sticky;
      top: var(--space-4);
      padding: var(--space-4);
      background: var(--panel);
      border: 1px solid var(--rule);
      border-left: 4px solid var(--accent);
    }
    nav.toc .toc-title {
      margin: 0 0 var(--space-3);
      font-family: var(--font-body);
      font-size: 0.9375rem;
      font-weight: 700;
      line-height: 1.3;
    }
    nav.toc ol {
      margin: 0;
      padding: 0 0 0 1.25rem;
    }
    nav.toc li {
      margin: 0 0 var(--space-2);
      font-size: 0.875rem;
      line-height: 1.35;
    }
    nav.toc a { color: var(--ink); }

    main { min-width: 0; }

    section.block {
      margin: 0 0 var(--space-7);
      scroll-margin-top: var(--space-5);
    }

    h2 {
      margin: 0 0 var(--space-4);
      padding-bottom: var(--space-2);
      border-bottom: 1px solid var(--rule-strong);
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.25;
    }
    h2 .secno {
      display: inline-block;
      min-width: 2.1rem;
      margin-right: var(--space-2);
      color: var(--accent);
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 700;
      vertical-align: middle;
    }

    h3 {
      margin: var(--space-5) 0 var(--space-3);
      font-family: var(--font-body);
      font-size: 1.0625rem;
      font-weight: 700;
      line-height: 1.3;
    }

    p { margin: 0 0 var(--space-4); max-width: var(--measure); }
    p.wide, .note { max-width: none; }

    .bluf {
      padding: var(--space-5);
      background: var(--panel);
      border: 1px solid var(--rule);
      border-top: 6px solid var(--accent);
    }
    .bluf p:last-child { margin-bottom: 0; }
    .bluf strong { font-weight: 700; }

    .banner {
      margin: 0 0 var(--space-4);
      padding: var(--space-3) var(--space-4);
      background: var(--gap-fill);
      border: 2px solid var(--gap-rule);
      color: var(--gap-ink);
      max-width: none;
    }

    dl.meta {
      display: grid;
      grid-template-columns: minmax(9rem, 14rem) minmax(0, 1fr);
      gap: var(--space-2) var(--space-4);
      margin: 0 0 var(--space-4);
      padding: var(--space-4);
      background: var(--panel);
      border: 1px solid var(--rule);
    }
    dl.meta dt {
      margin: 0;
      font-weight: 700;
      color: var(--ink);
    }
    dl.meta dd {
      margin: 0;
      color: var(--ink);
      overflow-wrap: break-word;
    }

    .table-hint {
      display: none;
      margin: 0 0 var(--space-2);
      color: var(--ink-muted);
      font-size: 0.8125rem;
    }

    .table-scroll {
      margin: 0 0 var(--space-4);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--rule-strong);
      background: var(--panel-strong);
    }
    .table-scroll:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    table {
      width: 100%;
      min-width: var(--table-min);
      border-collapse: collapse;
      font-size: 0.875rem;
      line-height: 1.4;
    }
    caption {
      caption-side: top;
      text-align: left;
      padding: var(--space-3) var(--space-3) var(--space-2);
      font-weight: 700;
      color: var(--ink);
      background: var(--panel);
      border-bottom: 1px solid var(--rule);
    }
    th, td {
      padding: 0.55rem 0.7rem;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--rule);
      overflow-wrap: break-word;
      hyphens: manual;
    }
    thead th {
      background: var(--accent-wash);
      color: var(--ink);
      font-weight: 700;
      border-bottom: 2px solid var(--ink);
    }
    tbody th {
      background: transparent;
      font-weight: 700;
    }
    tbody tr:last-child th,
    tbody tr:last-child td { border-bottom: 0; }
    th.id, td.id {
      font-weight: 700;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .cell-digest {
      font-family: ui-monospace, "Liberation Mono", Menlo, Consolas, monospace;
      font-size: 0.8125rem;
      overflow-wrap: anywhere;
    }

    .row-pass { border-left: 6px solid var(--pass-rule); background: var(--pass-fill); }
    .row-gap { border-left: 6px double var(--gap-rule); background: var(--gap-fill); }
    .row-hold { border-left: 6px dashed var(--hold-rule); background: var(--hold-fill); }
    .row-na {
      border-left: 6px dashed var(--na-rule);
      background: repeating-linear-gradient(
        -45deg,
        var(--na-fill),
        var(--na-fill) 6px,
        #eef1f4 6px,
        #eef1f4 12px
      );
    }
    .row-plan { border-left: 6px solid var(--plan-rule); background: var(--panel-strong); }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.1rem 0.45rem 0.1rem 0.3rem;
      border: 1.5px solid currentColor;
      border-radius: var(--radius);
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
    }
    .status .mark {
      display: inline-block;
      width: 0.7rem;
      height: 0.7rem;
      flex: 0 0 0.7rem;
      background: currentColor;
    }
    .status-pass { color: var(--pass-ink); background: var(--panel-strong); }
    .status-pass .mark { clip-path: none; }
    .status-gap { color: var(--gap-ink); background: var(--panel-strong); }
    .status-gap .mark {
      width: 0.72rem;
      height: 0.72rem;
      background: transparent;
      border: 2px solid currentColor;
      transform: rotate(45deg);
    }
    .status-hold { color: var(--hold-ink); background: var(--panel-strong); }
    .status-hold .mark {
      border-radius: 50%;
      background: transparent;
      border: 2px solid currentColor;
    }
    .status-na { color: var(--na-ink); background: var(--panel-strong); }
    .status-na .mark {
      height: 0.18rem;
      width: 0.75rem;
      align-self: center;
    }
    .status-plan { color: var(--plan-ink); background: var(--panel-strong); }
    .status-plan .mark {
      background: transparent;
      border: 2px solid currentColor;
    }

    .reason {
      display: block;
      margin-top: var(--space-1);
      color: var(--ink-muted);
      font-weight: 400;
      white-space: normal;
    }

    figure.model {
      margin: 0 0 var(--space-5);
      padding: var(--space-4);
      background: var(--panel-strong);
      border: 1px solid var(--rule-strong);
    }
    .model-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--rule);
      background: var(--panel);
    }
    .model-scroll:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    figure.model img {
      display: block;
      width: 100%;
      min-width: 48rem;
      max-width: none;
      height: auto;
      background: var(--panel);
    }
    figure.model svg {
      display: block;
      width: 100%;
      min-width: 48rem;
      max-width: none;
      height: auto;
      background: var(--panel);
    }
    figcaption {
      margin-top: var(--space-3);
      font-size: 0.875rem;
      line-height: 1.45;
    }
    figcaption dl {
      display: grid;
      grid-template-columns: minmax(8rem, 11rem) minmax(0, 1fr);
      gap: var(--space-1) var(--space-3);
      margin: var(--space-2) 0 0;
    }
    figcaption dt { font-weight: 700; }
    figcaption dd { margin: 0; overflow-wrap: break-word; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3) var(--space-5);
      margin: 0 0 var(--space-4);
      padding: 0;
      list-style: none;
      font-size: 0.875rem;
    }
    .legend li { display: flex; align-items: center; gap: var(--space-2); }
    .swatch {
      display: inline-block;
      width: 1.1rem;
      height: 0.7rem;
      border: 2px solid var(--ink);
      background: var(--panel);
      flex: 0 0 1.1rem;
    }
    .swatch-ext { border-style: dashed; }
    .swatch-flow {
      height: 0;
      border-width: 0 0 2px 0;
      background: transparent;
      width: 1.4rem;
    }

    .status-key {
      margin: var(--space-4) 0 0;
      padding: var(--space-3) 0 0;
      border-top: 1px solid var(--rule);
    }
    .status-key .legend { margin: 0; }

    ul.plain, ol.plain { margin: 0 0 var(--space-4); max-width: var(--measure); }
    li { margin-bottom: var(--space-1); }

    footer.colophon {
      margin-top: var(--space-6);
      padding-top: var(--space-4);
      border-top: 2px solid var(--ink);
      font-size: 0.875rem;
      color: var(--ink-muted);
    }
    footer.colophon p { max-width: none; }

    @media screen and (max-width: 64rem) {
      .layout {
        grid-template-columns: 1fr;
        gap: var(--space-5);
      }
      nav.toc { position: static; }
      nav.toc ol {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
        gap: var(--space-1) var(--space-4);
        padding-left: 1.25rem;
      }
      h1 { max-width: none; }
    }

    @media screen and (max-width: 52rem) {
      .table-hint { display: block; }
    }

    @media screen and (max-width: 40rem) {
      .page {
        padding: var(--space-4) var(--space-3) var(--space-6);
        border-left-width: 6px;
      }
      dl.meta,
      figcaption dl {
        grid-template-columns: 1fr;
        gap: 0.15rem 0;
      }
      dl.meta dt { margin-top: var(--space-2); }
      dl.meta dt:first-child { margin-top: 0; }
    }

    @media print {
      :root {
        --paper: #ffffff;
        --panel: #ffffff;
        --panel-strong: #ffffff;
        --accent-wash: #e6ecee;
      }
      body { background: #ffffff; color: #000; }
      .page {
        max-width: none;
        padding: 0;
        border-left: 0;
        background: #ffffff;
        min-height: 0;
      }
      .skip { display: none; }
      .mast-wave { height: 1.6rem; margin-bottom: var(--space-3); }
      header.mast {
        break-after: avoid;
        border-bottom-color: #000;
      }
      nav.toc {
        position: static;
        background: #fff;
        border: 1px solid #000;
        break-inside: avoid;
        padding: 0.6rem 0.8rem;
        margin: 0 0 1rem;
      }
      nav.toc ol {
        display: block;
        columns: 2;
        column-gap: 1.5rem;
        padding-left: 1.2rem;
      }
      nav.toc li { break-inside: avoid; margin-bottom: 0.35rem; }
      .layout { display: block; }
      section.block { break-inside: auto; margin-bottom: 1.4rem; }
      h2 { break-after: avoid; border-bottom-color: #000; }
      h3 { break-after: avoid; }
      .banner, dl.meta {
        background: #fff;
        break-inside: avoid;
      }
      .bluf { background: #fff; }
      .table-hint { display: none; }
      .table-scroll {
        overflow: visible;
        border-color: #000;
        break-inside: auto;
      }
      table {
        min-width: 0;
        font-size: 8.5pt;
      }
      thead { display: table-header-group; }
      tr { break-inside: avoid; }
      thead th { background: #eee; color: #000; border-bottom-color: #000; }
      tbody th { background: transparent; }
      a { color: #000; }
      .stamp { background: #fff; }
      .row-pass, .row-gap, .row-hold, .row-na, .row-plan {
        background: #fff;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
      .row-na {
        background: repeating-linear-gradient(
          -45deg,
          #fff,
          #fff 5px,
          #ececec 5px,
          #ececec 10px
        );
      }
      .model-scroll {
        overflow: visible;
        border: 0;
        background: #fff;
      }
      figure.model {
        background: #fff;
        break-inside: avoid;
      }
      figure.model svg,
      figure.model img {
        width: 100%;
        min-width: 0;
        max-width: 100%;
        background: #fff;
      }
      footer.colophon { break-before: avoid; color: #000; border-top-color: #000; }
      @page {
        size: A4;
        margin: 12mm 10mm 14mm;
      }
    }
  </style>
</head>
<body>
<!--DOD_BODY-->
</body>
</html>
