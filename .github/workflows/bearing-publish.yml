# yamllint disable rule:line-length
name: Publish Bearing Lite npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (must match v<package version>)
        required: true
        type: string
      confirm:
        description: Type the exact package name and version to publish
        required: true
        type: string

permissions: {}

concurrency:
  group: bearing-lite-npm-publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      checks: read
      contents: read
      security-events: read
    outputs:
      commit_sha: ${{ steps.verify-tag.outputs.commit_sha }}
      tarball_name: ${{ steps.pack.outputs.tarball_name }}
      tarball_sha256: ${{ steps.pack.outputs.tarball_sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.14.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up pnpm and npm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          npm install --global npm@11.15.0

      - name: Verify immutable release tag and confirmation
        id: verify-tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          expected_confirmation="${package_name}@${package_version}"
          test "$REQUESTED_TAG" = "$expected_tag"
          test "$CONFIRMATION" = "$expected_confirmation"
          commit_sha="$(git rev-parse HEAD)"
          test "$commit_sha" = "$(git rev-parse "${expected_tag}^{commit}")"
          printf 'commit_sha=%s\n' "$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Verify main and required hosted checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          main_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$checked_out_sha" = "$main_sha"
          gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/commits/${checked_out_sha}/check-runs?filter=latest&per_page=100" \
            > "${RUNNER_TEMP}/check-runs.json"
          CHECKS_FILE="${RUNNER_TEMP}/check-runs.json" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const pages = JSON.parse(readFileSync(process.env.CHECKS_FILE, "utf8"));
          const runs = pages.flatMap((page) => page.check_runs ?? []);
          for (const name of ["quality", "Semgrep scan", "Analyze (javascript-typescript)", "Analyze (actions)"]) {
            const latest = runs.filter((run) => run.name === name).sort((a, b) => b.id - a.id)[0];
            if (!latest || latest.status !== "completed" || latest.conclusion !== "success") {
              throw new Error(`Required check is not successful: ${name}`);
            }
            console.log(`Verified ${name}: ${latest.html_url}`);
          }
          NODE
          gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?ref=refs/heads/main&state=open&tool_name=CodeQL&per_page=100" \
            > "${RUNNER_TEMP}/codeql-alerts.json"
          ALERTS_FILE="${RUNNER_TEMP}/codeql-alerts.json" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const alerts = JSON.parse(readFileSync(process.env.ALERTS_FILE, "utf8")).flat();
          if (alerts.length) throw new Error(`CodeQL has ${alerts.length} open alert(s)`);
          NODE

      - name: Verify release candidate
        run: |
          pnpm install --frozen-lockfile
          node --test test/*.test.mjs
          npm install --prefix "${RUNNER_TEMP}/bearing-codex" --ignore-scripts --no-audit --no-fund @openai/codex@0.162.1
          export BEARING_CODEX_BIN="${RUNNER_TEMP}/bearing-codex/node_modules/.bin/codex"
          test "$("$BEARING_CODEX_BIN" --version)" = "codex-cli 0.162.1"
          node --test test/native/codex-hook-discovery.test.mjs test/native/assurance-dispatch.test.mjs
          pnpm audit --audit-level=moderate
          npm pack --dry-run --json

      - name: Pack release tarball and record SHA-256
        id: pack
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/release-artifact"
          mkdir -p "$artifact_dir"
          npm pack --pack-destination "$artifact_dir" --json > "${RUNNER_TEMP}/pack.json"
          tarball_name="$(PACK_JSON="${RUNNER_TEMP}/pack.json" node <<'NODE'
          const pack = require(process.env.PACK_JSON);
          if (!Array.isArray(pack) || pack.length !== 1 || !pack[0].filename) {
            throw new Error("Expected a single packed tarball");
          }
          const name = pack[0].filename;
          if (name.includes("/") || name.includes("..") || !name.endsWith(".tgz")) {
            throw new Error(`Unexpected tarball filename: ${name}`);
          }
          console.log(name);
          NODE
          )"
          tarball_path="${artifact_dir}/${tarball_name}"
          test -f "$tarball_path"
          (
            cd "$artifact_dir"
            sha256sum "$tarball_name" > "${tarball_name}.sha256"
          )
          tarball_sha256="$(awk '{print $1}' "${tarball_path}.sha256")"
          test "${#tarball_sha256}" -eq 64
          printf 'tarball_name=%s\n' "$tarball_name" >> "$GITHUB_OUTPUT"
          printf 'tarball_sha256=%s\n' "$tarball_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload verified release tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarball
          path: ${{ runner.temp }}/release-artifact
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.14.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up npm
        run: npm install --global npm@11.15.0

      - name: Verify tag still points to verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          VERIFIED_SHA: ${{ needs.verify.outputs.commit_sha }}
        run: |
          set -euo pipefail
          test -n "$VERIFIED_SHA"
          ref_json="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${REQUESTED_TAG}")"
          obj_type="$(printf '%s' "$ref_json" | node -e "const r = JSON.parse(require('node:fs').readFileSync(0, 'utf8')); console.log(r.object.type);")"
          obj_sha="$(printf '%s' "$ref_json" | node -e "const r = JSON.parse(require('node:fs').readFileSync(0, 'utf8')); console.log(r.object.sha);")"
          while [ "$obj_type" = "tag" ]; do
            tag_json="$(gh api "/repos/${GITHUB_REPOSITORY}/git/tags/${obj_sha}")"
            obj_type="$(printf '%s' "$tag_json" | node -e "const r = JSON.parse(require('node:fs').readFileSync(0, 'utf8')); console.log(r.object.type);")"
            obj_sha="$(printf '%s' "$tag_json" | node -e "const r = JSON.parse(require('node:fs').readFileSync(0, 'utf8')); console.log(r.object.sha);")"
          done
          test "$obj_type" = "commit"
          test "$obj_sha" = "$VERIFIED_SHA"

      - name: Download verified release tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
          path: ${{ runner.temp }}/release-artifact
          digest-mismatch: error

      - name: Verify tarball SHA-256
        env:
          TARBALL_NAME: ${{ needs.verify.outputs.tarball_name }}
          EXPECTED_SHA256: ${{ needs.verify.outputs.tarball_sha256 }}
        run: |
          set -euo pipefail
          case "$TARBALL_NAME" in
            ""|*/*|*..*)
              echo "Invalid tarball name: $TARBALL_NAME" >&2
              exit 1
              ;;
          esac
          test "${#EXPECTED_SHA256}" -eq 64
          artifact_dir="${RUNNER_TEMP}/release-artifact"
          test -f "${artifact_dir}/${TARBALL_NAME}"
          test -f "${artifact_dir}/${TARBALL_NAME}.sha256"
          (
            cd "$artifact_dir"
            printf '%s  %s\n' "$EXPECTED_SHA256" "$TARBALL_NAME" | sha256sum -c -
            sha256sum -c "${TARBALL_NAME}.sha256"
          )

      - name: Publish with npm trusted publishing
        env:
          TARBALL_NAME: ${{ needs.verify.outputs.tarball_name }}
        run: npm publish "${RUNNER_TEMP}/release-artifact/${TARBALL_NAME}" --access public
