name: Bearing quality

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bearing-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test public Lite contract
        run: node --test test/*.test.mjs

      - name: Native Codex hook discovery
        # Test-only tooling, pinned; never a package dependency. Registration proof, not invocation.
        run: |
          set -euo pipefail
          npm install --prefix "${RUNNER_TEMP}/bearing-codex" --ignore-scripts --no-audit --no-fund @openai/codex@0.162.1
          export BEARING_CODEX_BIN="${RUNNER_TEMP}/bearing-codex/node_modules/.bin/codex"
          test "$("$BEARING_CODEX_BIN" --version)" = "codex-cli 0.162.1"
          node --test test/native/codex-hook-discovery.test.mjs test/native/assurance-dispatch.test.mjs

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64

      - name: Validate Lite artifact schemas
        env:
          BEARING_LITE_SCHEMA_ISOLATED_ROOT: ${{ runner.temp }}/lite-schema-validator
        run: |
          python3 -m pip install \
            --isolated \
            --disable-pip-version-check \
            --no-input \
            --no-compile \
            --upgrade-strategy only-if-needed \
            --target "${BEARING_LITE_SCHEMA_ISOLATED_ROOT}" \
            --require-hashes \
            --no-deps \
            -r test/schema-validator-requirements.txt
          python3 test/schema-validation.py

      - name: Audit
        run: pnpm audit --audit-level=moderate

      - name: Check package contents
        run: |
          npm pack --dry-run --json > "${RUNNER_TEMP}/pack.json"
          PACK_JSON="${RUNNER_TEMP}/pack.json" node <<'NODE'
          const pack = require(process.env.PACK_JSON)[0];
          const pkg = require("./package.json");
          if (pack.name !== pkg.name || pack.version !== pkg.version) {
            throw new Error(`Unexpected package identity: ${pack.name}@${pack.version}`);
          }
          if (pack.entryCount !== pack.files.length || pack.files.length === 0) {
            throw new Error(`Invalid packed file count: ${pack.entryCount}/${pack.files.length}`);
          }
          NODE

      - name: Check whitespace
        run: git diff --check
